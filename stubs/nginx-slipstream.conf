# Slipstream nginx settings — merge these into your existing server block.
#
# 1. Serve from the `current` symlink, not the checkout root.
#
#    Before the first deploy there is no `current`, so flip this only after
#    `slipstream:provision` has adopted the checkout (or after a deploy has
#    succeeded). Both paths then serve identical bytes, so the flip is
#    zero-downtime.

root /var/www/APP/current/public;

# 2. Resolve the real release directory per request.
#
#    Required with symlinked releases: without it PHP-FPM keys opcache on the
#    unchanging `current/...` path and keeps serving the previous release's
#    compiled code after a swap.
#
#    It also makes permission problems fail loudly. If nginx cannot traverse
#    the release directory, $realpath_root resolves to an empty string and FPM
#    is handed a bare /index.php — which reaches the browser as the famously
#    unhelpful "No input file specified".

location ~ \.php$ {
    # ... your existing fastcgi_pass / include snippets ...
    include                     fastcgi_params;
    fastcgi_pass                unix:/run/php/php8.4-fpm.sock;

    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT   $realpath_root;
}

# Apply with:
#   sudo nginx -t && sudo systemctl reload nginx
#
# `php artisan slipstream:doctor` checks the resulting layout, ownership and
# permissions, and names the fix for anything it finds.
