# Slipstream nginx settings — merge these into your existing server block.
#
# 1. Serve from the `current` symlink, not the checkout root.
#
#    Before the first deploy there is no `current`, so flip this only after
#    `slipstream:provision` has adopted the checkout (or after a deploy has
#    succeeded). Both paths then serve identical bytes, so the flip is
#    zero-downtime.

root /var/www/APP/current/public;

# 2. Hand only the front controller to PHP-FPM, and resolve the real release
#    directory per request.
#
#    Only index.php runs. Any other .php under public/ — one that lands in
#    storage/app/public through an upload and is reachable as /storage/x.php,
#    say — gets a 404 and never executes. This is what Laravel's own nginx
#    configuration does (it serves such a file as text instead).
#
#    $realpath_root is required with symlinked releases: without it PHP-FPM
#    keys opcache on the unchanging `current/...` path and keeps serving the
#    previous release's compiled code after a swap.
#
#    It also makes permission problems fail loudly. If nginx cannot traverse
#    the release directory, $realpath_root resolves to an empty string and FPM
#    is handed a bare /index.php — which reaches the browser as the famously
#    unhelpful "No input file specified".

location ~ ^/index\.php(/|$) {
    # ... your existing fastcgi_pass / include snippets ...
    include                     fastcgi_params;
    fastcgi_pass                unix:/run/php/php8.4-fpm.sock;

    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT   $realpath_root;
    fastcgi_hide_header           X-Powered-By;
}

location ~ \.php$ {
    return 404;
}

# 3. Optional: only let your git host reach the deploy hook.
#
#    Every delivery is HMAC/token verified regardless; this adds a source
#    restriction in front of that — the same thing SLIPSTREAM_WEBHOOK_ALLOWED_IPS
#    does inside the app, and what a PCI review asks for on an unauthenticated
#    route. Fill the allow lines from the provider's published ranges (GitHub:
#    the "hooks" list at https://api.github.com/meta; Bitbucket Cloud:
#    https://ip-ranges.atlassian.com/) and refresh them when a delivery is
#    refused — both providers change them over time. The path follows
#    SLIPSTREAM_PATH ({path}/hooks/deploy), or SLIPSTREAM_HOOKS_PATH when that
#    is set (e.g. location = /_hooks/deploy).
#
# location = /slipstream/hooks/deploy {
#     allow 192.0.2.0/24;                      # the provider's ranges, not this example
#     deny  all;
#     try_files $uri /index.php?$query_string;
# }

# Apply with:
#   sudo nginx -t && sudo systemctl reload nginx
#
# `php artisan slipstream:doctor` checks the resulting layout, ownership and
# permissions, and names the fix for anything it finds.
